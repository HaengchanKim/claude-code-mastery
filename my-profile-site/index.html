<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>프로필</title>
    <meta name="description" content="개인 프로필 및 포트폴리오 사이트">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        // 다크모드는 <html> 태그의 class 로 제어
        tailwind.config = { darkMode: 'class' };

        // FOUC 방지: 화면이 그려지기 전에 저장된 테마를 먼저 적용
        (function () {
            try {
                var saved = localStorage.getItem('theme');
                var isDark = saved
                    ? saved === 'dark'
                    : window.matchMedia('(prefers-color-scheme: dark)').matches;
                if (isDark) document.documentElement.classList.add('dark');
            } catch (e) { /* 저장소 접근 불가 시 라이트 모드 유지 */ }
        })();
    </script>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-white text-slate-700 dark:bg-slate-950 dark:text-slate-300 antialiased">

    <!-- ===== 헤더 네비게이션 ===== -->
    <header id="siteHeader" class="sticky top-0 z-50 border-b border-slate-200/80 bg-white/80 backdrop-blur dark:border-slate-800/80 dark:bg-slate-950/80">
        <nav class="mx-auto flex h-16 max-w-5xl items-center justify-between px-6">
            <a href="#top" id="navName" class="text-[15px] font-semibold tracking-tight text-slate-900 dark:text-white"></a>

            <div class="flex items-center gap-1">
                <div class="hidden items-center gap-1 md:flex">
                    <a href="#about" class="nav-link">About</a>
                    <a href="#skills" class="nav-link">Skills</a>
                    <a href="#projects" class="nav-link">Projects</a>
                    <a href="#contact" class="nav-link">Contact</a>
                </div>

                <button id="themeToggle" type="button" aria-label="다크모드 전환"
                        class="ml-2 flex h-9 w-9 items-center justify-center rounded-full border border-slate-200 text-slate-500 transition hover:border-indigo-300 hover:text-indigo-600 dark:border-slate-700 dark:text-slate-400 dark:hover:border-indigo-500 dark:hover:text-indigo-400">
                    <!-- 해 아이콘 (다크모드일 때 표시) -->
                    <svg class="hidden h-[18px] w-[18px] dark:block" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path>
                    </svg>
                    <!-- 달 아이콘 (라이트모드일 때 표시) -->
                    <svg class="h-[18px] w-[18px] dark:hidden" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"></path>
                    </svg>
                </button>
            </div>
        </nav>
    </header>

    <main id="top" class="mx-auto max-w-5xl px-6">

        <!-- ===== Hero ===== -->
        <section class="reveal flex flex-col items-center py-20 text-center sm:py-28">
            <div id="heroAvatar" class="mb-7 flex h-24 w-24 items-center justify-center rounded-full bg-gradient-to-br from-indigo-500 to-violet-500 text-3xl font-bold text-white shadow-lg shadow-indigo-500/20"></div>

            <p id="heroTagline" class="mb-4 text-sm font-medium text-indigo-600 dark:text-indigo-400"></p>
            <h1 id="heroName" class="text-4xl font-bold tracking-tight text-slate-900 sm:text-5xl dark:text-white"></h1>
            <p id="heroRole" class="mt-3 text-lg text-slate-500 dark:text-slate-400"></p>

            <div id="heroLinks" class="mt-9 flex flex-wrap items-center justify-center gap-3"></div>
        </section>

        <!-- ===== About ===== -->
        <section id="about" class="reveal scroll-mt-24 border-t border-slate-100 py-16 dark:border-slate-900 sm:py-20">
            <h2 class="section-title">About</h2>
            <div id="aboutText" class="mt-8 max-w-2xl space-y-4 text-[17px] leading-relaxed"></div>
        </section>

        <!-- ===== Skills ===== -->
        <section id="skills" class="reveal scroll-mt-24 border-t border-slate-100 py-16 dark:border-slate-900 sm:py-20">
            <h2 class="section-title">Skills</h2>
            <div id="skillGrid" class="mt-8 grid gap-x-8 gap-y-6 sm:grid-cols-2"></div>
        </section>

        <!-- ===== Projects ===== -->
        <section id="projects" class="reveal scroll-mt-24 border-t border-slate-100 py-16 dark:border-slate-900 sm:py-20">
            <h2 class="section-title">Projects</h2>
            <div id="projectGrid" class="mt-8 grid gap-6 md:grid-cols-2 lg:grid-cols-3"></div>
        </section>

        <!-- ===== Contact ===== -->
        <section id="contact" class="reveal scroll-mt-24 border-t border-slate-100 py-16 dark:border-slate-900 sm:py-24">
            <h2 class="section-title">Contact</h2>
            <p id="contactMessage" class="mt-8 max-w-xl text-[17px] leading-relaxed"></p>
            <div id="contactLinks" class="mt-8 grid gap-3 sm:grid-cols-2"></div>
        </section>
    </main>

    <!-- ===== 푸터 ===== -->
    <footer class="border-t border-slate-100 dark:border-slate-900">
        <div class="mx-auto max-w-5xl px-6 py-10 text-sm text-slate-400 dark:text-slate-600">
            <p id="footerText"></p>
        </div>
    </footer>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
